name: Regression

on:
  push:
  pull_request:

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: dotnet test Release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Do not `dotnet test` the full slnx on Linux: Desktop is net10.0-windows.
      - name: Domain tests
        run: dotnet test tests/CabinetNC.Domain.Tests/CabinetNC.Domain.Tests.csproj -c Release --verbosity minimal

      - name: Package tests
        run: dotnet test tests/CabinetNC.Package.Tests/CabinetNC.Package.Tests.csproj -c Release --verbosity minimal

      - name: Infrastructure tests
        run: dotnet test tests/CabinetNC.Infrastructure.Tests/CabinetNC.Infrastructure.Tests.csproj -c Release --verbosity minimal

      # Transport-neutral nesting runner shared by the local gRPC worker and the intranet worker.
      - name: Compute.Core tests
        run: dotnet test tests/CabinetNC.Compute.Core.Tests/CabinetNC.Compute.Core.Tests.csproj -c Release --verbosity minimal

      # Desktop <-> intranet API wire contracts (camelCase JSON pinned byte-for-byte).
      - name: Cloud.Contracts tests
        run: dotnet test tests/CabinetNC.Cloud.Contracts.Tests/CabinetNC.Cloud.Contracts.Tests.csproj -c Release --verbosity minimal

      # Job leasing against a real PostgreSQL and object storage against a real MinIO, both started by
      # Testcontainers (Docker is present on ubuntu-latest). Without a usable Docker these tests SKIP
      # with a reason — never a fake pass.
      - name: Cloud.Infrastructure tests (PostgreSQL + MinIO via Testcontainers)
        run: dotnet test tests/CabinetNC.Cloud.Infrastructure.Tests/CabinetNC.Cloud.Infrastructure.Tests.csproj -c Release --verbosity normal

      # Full HTTP auth flow (bootstrap, JWT, rotating refresh/reuse, logout, rate limits) against
      # another real PostgreSQL started by Testcontainers.
      - name: Cloud.Api tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/CabinetNC.Cloud.Api.Tests/CabinetNC.Cloud.Api.Tests.csproj -c Release --verbosity normal

      # WPF-free UI logic (status inference, viewport math, sim timeline, unsaved fingerprint…)
      - name: Desktop.Core tests
        run: dotnet test tests/CabinetNC.Desktop.Core.Tests/CabinetNC.Desktop.Core.Tests.csproj -c Release --verbosity minimal
